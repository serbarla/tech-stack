services:
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    ports: ["3000:3000"]
    # List syntax = passthrough: set in the operator's shell/`.env` → forwarded;
    # unset → variable absent in the container → .env.schema default applies.
    # PORT is deliberately not passed through: the container always serves 3000
    # (port map + healthcheck hardcode it).
    environment:
      - DATABASE_URL=/data/sqlite.db
      - AUTH_SECRET
      - BETTER_AUTH_URL
    volumes: ["sb-data:/data"]
    healthcheck:
      test: ["CMD", "bun", "-e", 'process.exit((await fetch("http://127.0.0.1:3000/api/auth/ok")).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL to the public web origin (e.g. http://host:3001)}
    ports: ["3001:80"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sb-data:
