services:
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    ports: ["3000:3000"]
    # List syntax = passthrough: set in the operator's shell/`.env` → forwarded;
    # unset → variable absent in the container → .env.schema default applies.
    environment:
      - DATABASE_URL=/data/sqlite.db
      - AUTH_SECRET
      - BETTER_AUTH_URL
      - PORT
    volumes: ["./data:/data"]
    healthcheck:
      test: ["CMD", "bun", "-e", 'process.exit((await fetch("http://127.0.0.1:3000/api/auth/ok")).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: [VITE_API_URL]
    ports: ["3001:80"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
